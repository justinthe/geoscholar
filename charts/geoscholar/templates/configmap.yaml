apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "geoscholar.fullname" . }}-api
  labels: {{- include "geoscholar.labels" . | nindent 4 }}
data:
  GEOSCHOLAR_OLLAMA_URL: {{ include "geoscholar.ollamaUrl" . | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
